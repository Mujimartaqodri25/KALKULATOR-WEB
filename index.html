<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Lengkap - UTS Pemrograman Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        utama: '#165DFF',
                        aksi: '#FF7D00',
                        bersih: '#F53F3F',
                        gelap: '#1D2129',
                        terang: '#FFFFFF',
                        abu: '#F2F3F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .tombol {
                @apply w-full h-16 rounded-xl text-lg font-semibold shadow-sm transition-all duration-150 active:scale-95 hover:brightness-95 flex items-center justify-center;
            }
            .layar-kalkulator {
                @apply bg-gray-50 dark:bg-gray-700 rounded-xl p-4 text-right mb-4;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300 dark:bg-gradient-to-br dark:from-gray-800 dark:to-gray-900">

    <!-- BAGIAN IDENTITAS -->
    <div class="text-center mb-6 w-full max-w-xs">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Kalkulator Lengkap</h1>
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-2">
            <p class="text-gray-700 dark:text-gray-200">Nama : Muji Marta Qodri</p>
            <p class="text-gray-700 dark:text-gray-200">NIM : 231011450177</p>
        </div>
    </div>

    <!-- KOTAK UTAMA KALKULATOR -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-5 w-full max-w-xs">
        <!-- TOMBOL GANTI TEMA -->
        <div class="flex justify-end mb-3">
            <button id="tombolTema" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                <i class="fa fa-moon-o dark:hidden"></i>
                <i class="fa fa-sun-o hidden dark:inline-block"></i>
            </button>
        </div>

        <!-- LAYAR TAMPILAN -->
        <div class="layar-kalkulator">
            <p id="riwayat" class="text-sm text-gray-500 dark:text-gray-400 h-5 mb-1 overflow-hidden"></p>
            <input type="text" id="layar" readonly value="0" 
                class="w-full text-right text-4xl font-bold bg-transparent border-none outline-none text-gray-800 dark:text-white">
        </div>

        <!-- BARIS TOMBOL 1 -->
        <div class="grid grid-cols-4 gap-2.5 mb-2.5">
            <button class="tombol bg-bersih text-white" onclick="hapusSemua()">AC</button>
            <button class="tombol bg-gray-200 dark:bg-gray-700 dark:text-white" onclick="hapusSatu()"><i class="fa fa-backspace"></i></button>
            <button class="tombol bg-gray-200 dark:bg-gray-700 dark:text-white" onclick="tambahSimbol('%')">%</button>
            <button class="tombol bg-aksi text-white" onclick="tambahSimbol('/')"><i class="fa fa-divide"></i></button>
        </div>

        <!-- BARIS TOMBOL 2 -->
        <div class="grid grid-cols-4 gap-2.5 mb-2.5">
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('7')">7</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('8')">8</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('9')">9</button>
            <button class="tombol bg-aksi text-white" onclick="tambahSimbol('*')"><i class="fa fa-times"></i></button>
        </div>

        <!-- BARIS TOMBOL 3 -->
        <div class="grid grid-cols-4 gap-2.5 mb-2.5">
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('4')">4</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('5')">5</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('6')">6</button>
            <button class="tombol bg-aksi text-white" onclick="tambahSimbol('-')"><i class="fa fa-minus"></i></button>
        </div>

        <!-- BARIS TOMBOL 4 -->
        <div class="grid grid-cols-4 gap-2.5 mb-2.5">
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('1')">1</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('2')">2</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('3')">3</button>
            <button class="tombol bg-aksi text-white" onclick="tambahSimbol('+')"><i class="fa fa-plus"></i></button>
        </div>

        <!-- BARIS TOMBOL 5 -->
        <div class="grid grid-cols-4 gap-2.5">
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="ubahPositifNegatif()">+/-</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('0')">0</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="tambahAngka('.')">,</button>
            <button class="tombol bg-utama text-white h-[72px] row-span-2" onclick="hitung()"><i class="fa fa-equals text-xl"></i></button>
        </div>

        <!-- BARIS TOMBOL 6 -->
        <div class="grid grid-cols-3 gap-2.5 mt-2.5">
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="hitungAkar()">√</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="hitungPangkat()">x²</button>
            <button class="tombol bg-gray-100 dark:bg-gray-600 dark:text-white" onclick="hitungKebalikan()">1/x</button>
        </div>
    </div>

    <script>
        // Ambil elemen dari halaman
        const layar = document.getElementById('layar');
        const riwayat = document.getElementById('riwayat');
        const tombolTema = document.getElementById('tombolTema');
        let nilai = ''; // Menyimpan semua angka dan operasi yang dimasukkan

        // Fungsi ganti tema terang/gelap
        tombolTema.addEventListener('click', () => {
            document.body.classList.toggle('dark');
        });

        // Fungsi memasukkan angka
        function tambahAngka(angka) {
            // Cegah memasukkan titik desimal lebih dari satu kali
            if (angka === '.' && nilai.includes('.')) return;
            // Jika awalnya 0 dan bukan titik, ganti dengan angka yang dimasukkan
            if (nilai === '0' && angka !== '.') {
                nilai = angka;
            } else {
                nilai += angka;
            }
            perbaruiLayar();
        }

        // Fungsi memasukkan simbol operasi
        function tambahSimbol(simbol) {
            // Cegah memulai dengan operasi atau memasukkan operasi berturut-turut
            if (nilai === '' || isNaN(nilai.slice(-1))) return;
            nilai += simbol;
            perbaruiLayar();
        }

        // Fungsi mengubah angka menjadi positif atau negatif
        function ubahPositifNegatif() {
            if (nilai === '') return;
            // Cek apakah yang terakhir adalah angka
            if (!isNaN(nilai.slice(-1))) {
                // Cari posisi awal angka terakhir
                let posisi = nilai.length - 1;
                while (posisi >= 0 && !isNaN(nilai[posisi]) && nilai[posisi] !== '.') {
                    posisi--;
                }
                posisi++;
                // Ambil bagian sebelum angka dan angka itu sendiri
                let bagianAwal = nilai.substring(0, posisi);
                let angkaTerakhir = nilai.substring(posisi);
                // Ubah tanda
                if (angkaTerakhir.startsWith('-')) {
                    angkaTerakhir = angkaTerakhir.slice(1);
                } else {
                    angkaTerakhir = '-' + angkaTerakhir;
                }
                nilai = bagianAwal + angkaTerakhir;
                perbaruiLayar();
            }
        }

        // Fungsi menghitung akar kuadrat
        function hitungAkar() {
            if (nilai === '' || isNaN(nilai.slice(-1))) {
                riwayat.textContent = '⚠️ Masukkan angka terlebih dahulu';
                return;
            }
            try {
                let angka = eval(nilai);
                if (angka < 0) {
                    riwayat.textContent = '❌ Tidak bisa menghitung akar dari angka negatif';
                    return;
                }
                let hasil = Math.sqrt(angka);
                riwayat.textContent = `√(${angka}) = ${hasil}`;
                nilai = hasil.toString();
                perbaruiLayar();
            } catch (err) {
                riwayat.textContent = '❌ Perhitungan tidak valid';
            }
        }

        // Fungsi menghitung pangkat dua
        function hitungPangkat() {
            if (nilai === '' || isNaN(nilai.slice(-1))) {
                riwayat.textContent = '⚠️ Masukkan angka terlebih dahulu';
                return;
            }
            try {
                let angka = eval(nilai);
                let hasil = Math.pow(angka, 2);
                riwayat.textContent = `(${angka})² = ${hasil}`;
                nilai = hasil.toString();
                perbaruiLayar();
            } catch (err) {
                riwayat.textContent = '❌ Perhitungan tidak valid';
            }
        }

        // Fungsi menghitung kebalikan angka
        function hitungKebalikan() {
            if (nilai === '' || isNaN(nilai.slice(-1))) {
                riwayat.textContent = '⚠️ Masukkan angka terlebih dahulu';
                return;
            }
            try {
                let angka = eval(nilai);
                if (angka === 0) {
                    riwayat.textContent = '❌ Tidak bisa membagi dengan nol';
                    return;
                }
                let hasil = 1 / angka;
                riwayat.textContent = `1/(${angka}) = ${hasil}`;
                nilai = hasil.toString();
                perbaruiLayar();
            } catch (err) {
                riwayat.textContent = '❌ Perhitungan tidak valid';
            }
        }

        // Fungsi utama menghitung hasil akhir
        function hitung() {
            // Validasi input
            if (nilai === '' || isNaN(nilai.slice(-1))) {
                riwayat.textContent = '⚠️ Masukkan angka yang benar! Tidak boleh kosong atau diakhiri dengan operasi';
                return;
            }

            try {
                // Lakukan perhitungan
                let hasil = eval(nilai);
                // Tampilkan riwayat dan hasil
                riwayat.textContent = `${nilai} = ${hasil}`;
                nilai = hasil.toString();
                perbaruiLayar();
            } catch (err) {
                riwayat.textContent = '❌ Ekspresi yang dimasukkan tidak valid!';
                nilai = '';
                layar.value = '0';
            }
        }

        // Fungsi menghapus semua input
        function hapusSemua() {
            nilai = '';
            layar.value = '0';
            riwayat.textContent = '';
        }

        // Fungsi menghapus satu karakter terakhir
        function hapusSatu() {
            nilai = nilai.slice(0, -1);
            layar.value = nilai || '0';
            riwayat.textContent = '';
        }

        // Fungsi memperbarui tampilan layar
        function perbaruiLayar() {
            layar.value = nilai || '0';
        }
    </script>
</body>
</html>
